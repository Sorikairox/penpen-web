<!doctype html>
<!-- Pen Pen port, S5: capture page. Renders draw-list dumps (node/run.mjs --shots) with the WebGL2 backend;
     shot.mjs drives it over the DevTools protocol (inside the --network none Chromium container). -->
<html><head><meta charset="utf-8"><title>shot</title></head>
<body style="margin:0;background:#222">
<canvas id="c" width="640" height="480"></canvas>
<script src="/render/gl/render_gl.js"></script>
<script>
  const canvas = document.getElementById('c');
  const r = PenpenGL.create(canvas);
  // render one dump; resolve to {png: dataURL, stats}
  window.renderOne = async (name) => {
    const buf = await (await fetch('/shots/' + name)).arrayBuffer();
    const stats = r.frame(buf, 0);
    r.gl.finish();
    return { png: canvas.toDataURL('image/png'), stats };
  };
  document.title = 'READY';
</script>
</body></html>
